<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Furniture Ecommerce</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Staatliches&display=swap");
    </style>
  </head>
  <body>
    <nav>
      <div class="logo"><a href="#">CONCEPT</a></div>
      <ul>
        <li><a href="#">Best Sellers</a></li>
        <li><a href="#">All</a></li>
        <li id="categories-li">
          <a href="#">Categories</a>
          <div class="sub-nav">
            <ul>
              <li><a href="#">LIVING</a></li>
              <li><a href="#">BEDROOM</a></li>
              <li><a href="#">KITCHEN</a></li>
              <li><a href="#">DINING</a></li>
              <li><a href="#">BATH</a></li>
              <li><a href="#">OUTDOOR</a></li>
            </ul>
          </div>
        </li>
        <li><a href="#">Sale</a></li>
      </ul>
      <ul>
        <li id="nav-cart"><a href="#">Cart(0)</a></li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main>
      <h1 class="page-title" id="main-title">All Products</h1>
      <!-- Sort By & Filter -->
      <section class="products-bar">
        <p class="result">List(<span id="result-count">0</span>)</p>
        <div class="sort-and-filter">
          <input
            class="filter-toggle"
            type="checkbox"
            name="filter-by"
            id="filter-by-checkbox"
          />
          <label class="filter-label" for="filter-by-checkbox">Filter By</label>
          <select class="sort-by" name="sort-by" id="sort-by-select">
            <option value="new-arrival" default>Sort By : New Arrival</option>
            <option value="price-asc">Sort By : Price(Low to High)</option>
            <option value="price-desc">Sort By : Price(High to Low)</option>
            <option value="name-asc">Sort By : Name(A to Z)</option>
            <option value="name-desc">Sort By : Name(Z to A)</option>
          </select>
        </div>
      </section>
      <!-- Products List -->
      <section class="products-list" id="product-grid">
        <!-- Products will be dynamically inserted here -->
        <div class="product-card">
          <!-- <img src="https://via.placeholder.com/150" alt="Product Image" />
          <div class="product-details">
            <div>
              <p class="product-name">Product Name</p>
              <p class="product-price">$99.99</p>
            </div>
            <div class="add-to-cart-btn">+</div> -->
          </div>
        </div>
      </section>
    </main>
    <!-- Modal -->
    <section id="product-modal" class="product-modal">
    <!-- img -->
      <div class="product-img" id="modal-product-img" ></div>
      <div class="container">
        <!-- top bar ----------------------------->
        <div class="top-bar">
          <div class="status-box">
            <span class="circle"></span>
            <p class="status-text">In Stock</p>
          </div>
          <div class="close-btn" id="close-modal-btn">X</div>
        </div>
        <!-- main ----------------------------->
        <div id="modal-product-main">
          <!-- Product details will be dynamically inserted here -->
        </div>
      </div>
    </section>
    <footer>
      <p>
        &copy; 2025 Furniture Ecommerce Design and Development By Julie Chou.
        All rights reserved.
      </p>
    </footer>
  </body>
</html>
<script src="main.js" type="module"></script>
<!-- <script src="./productModal.js"></script> -->
